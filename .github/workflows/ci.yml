name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arriera
          POSTGRES_PASSWORD: arriera
          POSTGRES_DB: arriera_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U arriera" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check arriera tests alembic && ruff format --check arriera tests alembic
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://arriera:arriera@localhost:5433/arriera_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
