[project]
name = "arriera"
version = "0.1.0"
description = "Arriera · gestión documental con IA (backend)"
requires-python = ">=3.12"
dependencies = [
  "pikepdf==9.5.2",
  "httpx==0.28.1",
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.41",
  "alembic==1.16.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "argon2-cffi==23.1.0",
  "pyotp==2.9.0",
  "cryptography==45.0.3",
  "email-validator==2.2.0",
  "segno==1.6.6",
  "pillow==11.2.1",
  "numpy==2.2.6",
  "pypdfium2==4.30.1",
  "reportlab==4.4.1",
  "minio==7.2.15",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.12", "mypy==1.15.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arriera*"]

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
