server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript image/svg+xml application/json;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self)" always;
  location /_next/static/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; add_header X-Robots-Tag "noindex" always; }
  location / { try_files $uri $uri/ $uri.html /index.html; }
  error_page 404 /404.html;
}
